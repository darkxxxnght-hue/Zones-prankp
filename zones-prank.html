<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONES CYBER SYSTEM</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#000;color:#00ff66;
  font-family:monospace;text-align:center;
  padding:25px 12px;overflow:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
h1{font-size:42px;text-shadow:0 0 15px #00ff66}
.panel{
  max-width:500px;margin:25px auto;padding:20px;
  border:1px solid #00ff66;background:#001006dd;
  box-shadow:0 0 20px #00ff6644;
}
#logs{height:190px;overflow:hidden;text-align:left;line-height:1.8}
.big{font-size:24px;text-shadow:0 0 12px #00ff66}
.small{font-size:12px;color:#aaffbb}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<h1>ZONES</h1>
<p>CYBER SYSTEM // ONLINE</p>

<div class="panel">
  <p class="big">SYSTEM SCANNING...</p>
  <p id="clock"></p>
  <p id="device"></p>
  <div id="logs"></div>
  <p class="big" id="status"></p>
  <p class="small">SIMULATED EFFECT — NO PRIVATE DATA IS ACCESSED.</p>
  <h2>JUST A PRANK 😂</h2>
</div>

<script>
const clock=document.getElementById("clock");
const device=document.getElementById("device");
const logs=document.getElementById("logs");
const status=document.getElementById("status");

function updateClock(){
  clock.textContent="LOCAL TIME: "+new Date().toLocaleString();
}
updateClock();
setInterval(updateClock,1000);

device.textContent="BROWSER: "+navigator.language+
" | PLATFORM: "+navigator.platform;

const messages=[
"> Initializing ZONES system...",
"> Connecting to simulation...",
"> Checking browser information...",
"> Running visual scan...",
"> Analyzing demo signals...",
"> Simulation completed."
];

let i=0;
const timer=setInterval(()=>{
  if(i<messages.length){
    logs.innerHTML+="<div>"+messages[i]+"</div>";
    i++;
  }else{
    clearInterval(timer);
    status.textContent="ACCESS GRANTED";
  }
},1200);

// Matrix background animation
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
let drops=[];
function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
  drops=Array(Math.floor(canvas.width/16)).fill(1);
}
resize();
window.addEventListener("resize",resize);
function draw(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff66";
  ctx.font="15px monospace";
  drops.forEach((y,x)=>{
    ctx.fillText(Math.random()>0.5?"1":"0",x*16,y*16);
    if(y*16>canvas.height&&Math.random()>0.975)drops[x]=0;
    drops[x]++;
  });
}
setInterval(draw,50);
</script>
</body>
</html>
